---
# yaml-language-server: $schema=https://json.schemastore.org/pre-commit-config.json

# For pre-commit, install hooks: `pre-commit install`

# Using prek instead of pre-commit? Install hooks: `prek install -f`

# Set the project's default language versions for hooks that require a specific language version.
default_language_version:
  python: python3.14

# Whether to stop running hooks after a first failure
fail_fast: false

# exclude: Exclude files from being checked
# use pipes to exclude multiple files or directories
exclude: |
  (?x)^(
    .venv/.*|
    .vscode/.*|
    .gitignore|
    .dockerignore|
    Taskfile.yml|
    justfile|
  )$

# Make `prek autoupdate` behave exactly like Dependabot's pre-commit ecosystem:
# rewrite `rev` to the new immutable commit SHA and refresh the `# frozen: <tag>`
# comment. prek's `--freeze` defaults to FALSE, so without this a bare
# `prek autoupdate` would replace every SHA below with a mutable tag -- including
# repos whose version did not change -- silently undoing the immutable-revision
# pinning this file relies on (PY-CI-003).
#
# Trade-off: vanilla pre-commit does not know this key and prints
# `[WARNING] Unexpected key(s) present at root: update` on every invocation. It is
# cosmetic only -- `pre-commit validate-config` still exits 0 and hooks still run.
# Drop this block and pass `prek autoupdate --freeze` by hand to silence it.
update:
  freeze: true

repos:
  # -- General file hygiene ----------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: pretty-format-json
        args: ["--autofix", "--no-sort-keys"]
      - id: check-json
      - id: check-toml
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-ast

  # Useful if you have hooks with `additional_dependencies` that need to be kept up to date.
  - repo: https://github.com/pre-commit/sync-pre-commit-deps
    rev: 497f8ebf9d58162bb5898e3973a633d31d511169 # frozen: v0.0.5
    hooks:
      - id: sync-pre-commit-deps

  # -- Prose related hooks -----------------------------------------------

  # Hermetic node env managed by the hook runner, NOT `npx -y` at run time. The npx
  # form installed an unpinned copy into the shared ~/.npm/_npx cache on every run,
  # and concurrent installs raced it: CI failed with `ENOTEMPTY ... rmdir
  # .../lru-cache/...` followed by `Cannot find module .../cliPrettify.js`, while every
  # other hook passed. `language: node` + a pinned additional_dependencies resolves the
  # package once at env-setup time into an isolated prefix, so the gate is deterministic
  # and no longer depends on shared mutable npm state (PY-CI-001). require_serial keeps
  # a single process even when the runner batches files, matching markdownlint-cli2
  # below. sync-pre-commit-deps keeps the pinned version honest.
  - repo: local
    hooks:
      - id: markdown-table-formatter
        name: markdown-table-formatter
        language: node
        entry: markdown-table-formatter
        additional_dependencies: ["markdown-table-formatter@1.7.0"]
        types: [markdown]
        require_serial: true

  # requires .markdownlint-cli2.jsonc at the root of the repository
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: b82a6c8896e491b9cb377a99ff3412131920681b # frozen: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args: ["--config", ".markdownlint-cli2.jsonc", "--fix"]
        require_serial: true

  # -- Python related hooks ----------------------------------------------
  # Syntax upgrades (UP) are owned by ruff below, not a separate pyupgrade hook, so a
  # single tool owns that gate (PY-PROJ-007: no overlapping tools). ruff infers the
  # upgrade target from pyproject's requires-python (>=3.14).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 39d9ac5938dadb73df0564a45f163e25ff9fa6e2 # frozen: v0.16.1
    hooks:
      # Run the linter. Upstream types_or is [python, pyi, jupyter], which matches
      # `ruff check`'s own scope: it does not lint Python inside Markdown fences
      # ("No Python files found" on a .md path), so no override is needed here.
      - id: ruff-check
        args: ["--fix", "--show-fixes"]
      # Run the formatter. ruff 0.16 formats Python code blocks inside Markdown by
      # default, but the upstream hook still selects only [python, pyi, jupyter] --
      # so `ruff format .` locally covered 11 more files than this hook did. Adding
      # markdown makes the hook's file set match the direct command's (PY-CI-001:
      # same result locally and in CI). No writer conflict: markdownlint-cli2 and
      # markdown-table-formatter own document structure, ruff owns fence interiors.
      - id: ruff-format
        types_or: [python, pyi, jupyter, markdown]

  - repo: https://github.com/jsh9/pydoclint
    rev: cf8f4d0b81f933ebc5414acadcf7acdab705baa1 # frozen: 0.9.1
    hooks:
      - id: pydoclint
        args: ["--config", "pyproject.toml"]

  # -- TYPE CHECKER: choose exactly one of the two blocks below ----------

  # Vanilla pyright, without any of the basedpyright extensions.
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: 392b6ba8e54be6d603e02e9f8d601d27b7a48d12 # frozen: v1.1.411
    hooks:
      - id: pyright
        pass_filenames: false

  # -- Tests -------------------------------------------------------------
  # Full test suite as a gate hook so `prek run` (and CI's single gate job)
  # covers pytest alongside lint/type/security. system language = uses the
  # project's own uv environment.
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        language: system
        entry: uv run pytest
        pass_filenames: false
        always_run: true

  # -- Security related hooks --------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08 # frozen: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        exclude: ^tests/

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
        # args: ["--config", ".gitleaks.toml"]  # Optional: specify a custom configuration file with exclusions

  # -- GitHub Actions workflow security ----------------------------------
  # actionlint (language: golang) and zizmor (language: python) make the
  # single `prek` gate cover workflow linting + security too. prek manages
  # the Go and Python toolchains these hooks need.
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 451b56af716f9f0d0c2b816503a3fd0cf8b036fa # frozen: v1.29.0
    hooks:
      - id: zizmor
