---
name: Security scan

# Scheduled autonomy re-run: re-tests the full gate against main even with no open
# PR, plus a fresh dependency-advisory scan (catches advisories published after
# merge). GitHub emails the repo owner on scheduled-run failure. Daily Dependabot
# activity keeps this cron from auto-disabling after 60 days of inactivity.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan
  cancel-in-progress: false

jobs:
  full-gate:
    name: full-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.29"

      - name: Sync the environment
        env:
          UV_MALWARE_CHECK: "1"
        run: uv sync --locked

      - name: Run the full prek gate
        run: uv run prek run --all-files --show-diff-on-failure --color always

      - name: uv audit (advisory scan of uv.lock)
        run: uv audit --preview-features audit

      - name: OSV-Scanner (repo-wide)
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67  # v2.5.1
        with:
          scan-args: |-
            --recursive
            ./
