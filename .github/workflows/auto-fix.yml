---
name: Auto-fix

# A Validate failure is only a wake-up signal, NEVER a source of replacement bytes.
# All code, tools and configuration below come from this workflow's immutable base
# commit. PR blobs are data only. See docs/autofix-threat-model.md.
on:
  # Retained intentionally for base-owned code and the existing narrowly scoped App.
  # No PR checkout, PR dependency installation, hook execution or artifact download.
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: [Validate]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: auto-fix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  auto-fix:
    name: auto-fix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.actor.id == 49699333 &&
      github.event.workflow_run.triggering_actor.id == 49699333
    permissions:
      contents: read
      actions: read  # Authenticate the original run and its latest attempt.
      pull-requests: read  # Verify the current, open, same-repository bot PR.
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - name: Check out only the trusted workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Install the base-locked uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version-file: uv.lock
          enable-cache: false

      - name: Install only trusted base-locked tools
        env:
          UV_MALWARE_CHECK: "1"
        run: uv sync --locked --only-group dev --no-install-project --no-cache

      - name: Independently derive bounded fixes
        id: fixes
        env:
          GH_READ_TOKEN: ${{ github.token }}
          TRUSTED_SHA: ${{ github.workflow_sha }}
        run: .venv/bin/python -I scripts/autofix.py prepare

      - name: Mint a GitHub App token
        id: app-token
        if: steps.fixes.outputs.has_fixes == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Revalidate and atomically commit the locally derived fixes
        if: steps.fixes.outputs.has_fixes == 'true'
        env:
          GH_READ_TOKEN: ${{ github.token }}
          GH_WRITE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .venv/bin/python -I scripts/autofix.py apply
