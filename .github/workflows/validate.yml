---
name: Validate

on:
  pull_request:
  push:
    branches: [main]
  # Operator recovery when GitHub accepts a main push but drops its workflow dispatch.
  workflow_dispatch:
  # Reconcile bot merges whose GITHUB_TOKEN push cannot trigger another workflow.
  # This is eventual recovery, not an ordering dependency between workflows.
  repository_dispatch:
    types: [dependency-maintenance]
  schedule:
    - cron: "17 3 * * *"
    - cron: "17,47 0-2,4-23 * * *"
    - cron: "47 3 * * *"

# Read-only by default; jobs opt into the least privilege they need.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reconcile:
    name: reconcile
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.evidence.outputs.required }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - name: Check out the event commit
        if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Require full verification unless this main commit already passed
        id: evidence
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          WORKFLOW: validate.yml
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EVENT" == schedule && "$SCHEDULE" == '17 3 * * *' ]]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == schedule || "$EVENT" == repository_dispatch ]]; then
            node .github/scripts/main-verification.mjs
          else
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi

  # Single quality gate: runs the entire .pre-commit-config.yaml suite via prek
  # (lint + format + type + tests + secrets + workflow security), mirroring the
  # local gate exactly. This is the canonical required check.
  gate:
    needs: reconcile
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.reconcile.outputs.required == 'true'
    name: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
        with:
          version-file: uv.lock

      # --locked asserts uv.lock is already in sync with pyproject.toml and fails
      # otherwise, so a dependency change that skips `uv lock` cannot merge. The gate
      # CHECKS the committed lock; it never silently re-resolves it (bare `uv sync`
      # would). See PY-CI-001 / PY-PROJ-008.
      - name: Sync the environment
        env:
          UV_MALWARE_CHECK: "1"
        run: uv sync --locked

      - name: Run the full prek gate
        run: uv run prek run --all-files --show-diff-on-failure --color always

  # Dependency vulnerability scanning: advisory-DB-backed, kept separate from the
  # file-lint gate. uv audit reads uv.lock; OSV-Scanner scans the repo recursively.
  deps-security:
    needs: reconcile
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.reconcile.outputs.required == 'true'
    name: deps-security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
        with:
          version-file: uv.lock
          # gate owns the shared cache write; parallel saves race on the same key.
          save-cache: false

      - name: Sync the environment
        env:
          UV_MALWARE_CHECK: "1"
        run: uv sync --locked

      - name: Audit dependencies with the bounded no-fix policy
        run: bash scripts/audit-dependencies.sh

      - name: Preserve raw dependency audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dependency-audit-${{ github.job }}
          path: ${{ runner.temp }}/optimizer-dependency-audit/
          retention-days: 14
          if-no-files-found: warn

  # Conventional-Commit PR-title lint. The squash merge uses the PR title as the
  # release-relevant commit message, so the title must be a valid Conventional
  # Commit. Only runs on pull_request events (PR metadata, not files).
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - name: Lint the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: python
        run: |
          import os
          import re
          import sys

          title = os.environ["PR_TITLE"]
          allowed_types = (
              "build",
              "chore",
              "ci",
              "docs",
              "feat",
              "fix",
              "perf",
              "refactor",
              "revert",
              "style",
              "test",
          )
          pattern = re.compile(
              rf"^(?:{'|'.join(allowed_types)})(?:\([^()\r\n]+\))?!?: [^\r\n]+$"
          )
          if pattern.fullmatch(title) is None:
              print(
                  "Invalid pull request title. Expected '<type>[optional scope][!]: "
                  "<subject>' with a standard Conventional Commit type; got "
                  f"{title!r}.",
                  file=sys.stderr,
              )
              raise SystemExit(1)
