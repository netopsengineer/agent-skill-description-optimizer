---
name: Release

on:
  push:
    branches: [main]
  # Operator recovery when GitHub accepts a main push but drops its workflow dispatch.
  workflow_dispatch:

# Read-only by default; the release job elevates to contents: write, the publish
# job to id-token/attestations for OIDC trusted publishing.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # python-semantic-release inspects Conventional-Commit history, bumps the static
  # project.version, updates CHANGELOG.md, tags, and cuts a GitHub Release. It pushes
  # to protected main using the GitHub App token (the ruleset bypass actor); an App
  # push also re-triggers workflows, unlike GITHUB_TOKEN. PSR is idempotent, so its
  # own bump-commit push re-runs this workflow as a no-op.
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit

      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Least privilege: PSR only needs Contents (push bump/tag + create Release).
          permission-contents: write

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python Semantic Release
        id: release
        # PSR authenticates its push/tag/release via the github_token input (the App
        # token), so the checkout above keeps persist-credentials: false.
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278  # v10.7.0
        with:
          github_token: ${{ steps.app-token.outputs.token }}

  # Build + publish. Always builds and validates the artifact (the no-op test signal);
  # the PyPI upload is gated behind the PUBLISH_TO_PYPI repo variable so the release
  # path is fully exercised without contacting PyPI until deliberately enabled.
  publish:
    name: publish
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit

      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.11.29"
          # No cache in the publish path — avoids a cache-poisoning vector where a
          # restored cache could influence the artifact that gets published.
          enable-cache: false

      - name: Build the distribution
        env:
          UV_MALWARE_CHECK: "1"
        run: uv build

      - name: Check the distribution metadata
        run: uvx twine check dist/*

      - name: Publish to PyPI (OIDC trusted publishing, PEP 740 attestations)
        if: vars.PUBLISH_TO_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          attestations: true
