---
name: Release

on:
  push:
    branches: [main]
  # Operator recovery when GitHub accepts a main push but drops its workflow dispatch.
  workflow_dispatch:
  repository_dispatch:
    types: [dependency-maintenance]
  # Reconcile bot merges whose GITHUB_TOKEN push cannot trigger another workflow.
  # This is eventual recovery, not an ordering dependency between workflows.
  schedule:
    - cron: "47 3 * * *"

# Read-only by default; the release job elevates to contents: write, the publish
# job to id-token/attestations for OIDC trusted publishing.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verification:
    name: verification
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      ready: ${{ steps.evidence.outputs.ready }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - name: Check out the trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require successful validation of this exact main commit
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: node .github/scripts/release-verification.mjs

  # python-semantic-release inspects Conventional-Commit history, bumps the static
  # project.version, updates CHANGELOG.md, tags, and cuts a GitHub Release. It pushes
  # to protected main using the GitHub App token (the ruleset bypass actor); an App
  # push also re-triggers workflows, unlike GITHUB_TOKEN. PSR is idempotent, so its
  # own bump-commit push re-runs this workflow as a no-op.
  release:
    needs: verification
    if: needs.verification.outputs.ready == 'true'
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Least privilege: PSR only needs Contents (push bump/tag + create Release).
          permission-contents: write

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Preserve semantic-release branch identity at the validated commit
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: git switch -C main "$VERIFIED_SHA"

      - name: Python Semantic Release
        id: release
        # PSR authenticates its push/tag/release via the github_token input (the App
        # token), so the checkout above keeps persist-credentials: false.
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278  # v10.7.0
        with:
          github_token: ${{ steps.app-token.outputs.token }}

  # Build + publish. Always builds and validates the artifact (the no-op test signal);
  # the PyPI upload is gated behind the PUBLISH_TO_PYPI repo variable so the release
  # path is fully exercised without contacting PyPI until deliberately enabled.
  publish:
    name: publish
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version-file: uv.lock
          # No cache in the publish path — avoids a cache-poisoning vector where a
          # restored cache could influence the artifact that gets published.
          enable-cache: false

      - name: Build the distribution
        env:
          UV_MALWARE_CHECK: "1"
        run: uv build

      - name: Check the distribution metadata
        run: uvx twine check dist/*

      - name: Publish to PyPI (OIDC trusted publishing, PEP 740 attestations)
        if: vars.PUBLISH_TO_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          attestations: true
