---
name: Dependency queue

# Events are wake-up signals only. All executable bytes come from trusted main.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Recover missed events and merges that finish after their enabling workflow.
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read

concurrency:
  group: dependency-queue
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - name: Check out only the trusted workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Plan one oldest approved dependency refresh
        id: plan
        env:
          GH_READ_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/scripts/dependency-queue.mjs plan

      # This same repository-scoped Contents capability already performs bounded
      # dependency repairs in auto-fix.yml. No new App permission or installation.
      - name: Mint the existing repository-scoped App token
        if: steps.plan.outputs.refresh == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Merge trusted main without rewriting the dependency branch
        if: steps.plan.outputs.refresh == 'true'
        env:
          GH_READ_TOKEN: ${{ github.token }}
          GH_WRITE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node .github/scripts/dependency-queue.mjs apply

      - name: Wake current-main verification without trusting an event payload
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$REPO/dispatches" \
            -f event_type=dependency-maintenance
