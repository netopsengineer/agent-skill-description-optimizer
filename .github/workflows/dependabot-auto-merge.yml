---
name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # Approve and enable squash auto-merge only for Dependabot PRs created or updated
  # by a trusted automation sender. A human push to a Dependabot branch dismisses the
  # stale approval and fails this sender guard, so it cannot inherit bot approval.
  # GitHub's --auto flag then waits for every ruleset requirement, including the
  # required Validate checks. Repository prerequisite: Settings > Actions > General >
  # Workflow permissions > Allow GitHub Actions to create and approve pull requests.
  auto-merge:
    name: auto-merge
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.id == 49699333 &&
      github.repository == github.event.pull_request.head.repo.full_name &&
      (github.event.sender.id == 49699333 ||
       github.event.sender.id == 305056826)
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve and enable auto-merge for the current revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          is_current() {
            gh api "repos/$REPO/pulls/$PR_NUMBER" | jq -e \
              --arg head "$HEAD_SHA" --arg repo "$REPO" --arg base "$DEFAULT_BRANCH" '
              .state == "open" and .draft == false and .merged == false and
              .user.id == 49699333 and .head.repo.full_name == $repo and
              .base.repo.full_name == $repo and .base.ref == $base and
              .head.sha == $head' >/dev/null
          }
          if ! is_current; then
            echo "The bot event is stale; leaving review and merge unchanged."
            exit 0
          fi
          review_id=$(jq -nc --arg commit_id "$HEAD_SHA" \
            '{event: "APPROVE", commit_id: $commit_id,
              body: "Approved automatically for a trusted Dependabot revision."}' \
            | gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/reviews" --input - -q '.id')
          if ! is_current; then
            jq -nc '{message: "Head changed during automated review; refusing stale approval."}' \
              | gh api --method PUT "repos/$REPO/pulls/$PR_NUMBER/reviews/$review_id/dismissals" --input -
            exit 0
          fi
          gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"

      - name: Wake current-main verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$REPO/dispatches" \
            -f event_type=dependency-maintenance
